# abl_AC -- 400M-CLASS DEEP ALL-MoE, NO RECURRENCE: 6 standard-MoE blocks then 6 DISTINCT
# energy-MoE blocks (6S6E).  routing_norm: none.  PRIORITY 2.
#
# Replaces the 6 dense-GPT trunk blocks of abl_AB (6G6E) with standard sparse MoE, so every block in
# the model is a mixture.  A colleague ran this shape but on the 18.6%-prefix subset, whose loss is
# ~0.47 nats easier and therefore not comparable to anything in the 32B table, so it had to be redone
# on the full corpus.
#
# MATCHED ON ACTIVE AND FLOPwt, NOT ON TOTAL -- and that is forced, not a choice:
#
#              TOTAL(M)  ACTIVE(M)  FLOPwt(M)  I_S/d  apps
#   abl_AB       399.85     238.02     238.02   dense   12   (6 dense I=4096, then 6 energy blocks)
#   abl_AC       475.40     238.07     238.07    1.00   12   (this file)
#   ratio         1.189      1.000      1.000
# Parameters in millions.  ACTIVE and FLOPwt match to 0.02%; TOTAL is 18.9% higher.
#
# WHY NO SIZING CAN MATCH ALL THREE.  A dense block has active == total.  A top-k MoE block has
# active == (k/K) * total.  So replacing dense with MoE at FIXED total necessarily LOSES active:
# swept K_S in {4,8,16,32} x k_S in {1,2,4} x I_S in {128..4096} with audit_config, every iso-total
# sizing lands at 0.69-0.84x the reference ACTIVE (best 0.842), and every iso-active sizing costs at
# least 1.19x TOTAL.  There is no overlap.  Since no recurrence appears anywhere in either arm,
# FLOPwt == ACTIVE identically, so matching ACTIVE matches FLOPwt for free.
#
# Iso-ACTIVE was chosen because the question this arm answers is "at the same compute, does an
# all-mixture stack beat a dense trunk", and because an arm 15.8% short on FLOPs would repeat the
# defect that made the old sandwich rows unreadable.  The iso-TOTAL alternative at the 400M tier is
# K_S=4, k_S=2, I_S=1024 -> TOTAL 399.88M, ACTIVE/FLOPwt 200.30M (0.842x).  Swap if the 400M size
# class matters more than iso-compute.
#
# TRUNK SIZING: K_S=8, top-4, I_S=1024 per expert, I_S/hidden = 1.00.  Per-expert width is the
# thing to watch (pre-flight point 6): the 6G6S baseline's trunk sits at I_S/hidden = 0.28, inside
# the band this project has repeatedly found fails, and I_S/hidden < ~0.5 is treated as dead on
# arrival.  Note intermediate_size is PER-EXPERT for mlp_type: MoE but TOTAL across experts for the
# energy blocks; that asymmetry has cost a run before.
# k_S/K_S = 0.5 is only weakly sparse.  That is the direct price of iso-active: a K/k=16 trunk at
# iso-active would need TOTAL 1.53B.
#
# 61035 steps x 524,288 tok/step (8 GPU x mbs 2 x ga 8 x 4096) = 32.0B -- LAUNCH AT EXACTLY 8 GPUs.
# Data: the shared FULL corpus copy validated 2026-09-23, NOT the 18.6%-prefix subset.
#
