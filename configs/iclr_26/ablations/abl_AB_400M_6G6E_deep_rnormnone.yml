# abl_AB -- 400M DEEP, NO RECURRENCE (6 dense GPT then 6 DISTINCT energy-MoE blocks), rnorm=none.
#
# HIGH PRIORITY.  abl_H_400M_6G6E_deep is the only deep no-recurrence energy arm we have, and it was
# NEVER rerun with routing_norm: none -- it is still on zscore, so it is the one arm in the 400M
# tier that has not seen the single largest knob effect we measured.  At 134M, rnorm=none is
# +1.49pp Avg11 on the block-position variant and +0.10pp on the hybrid, and it collapses the
# 1.37pp block-placement penalty to 0.02pp.  It also does NOT collapse routing (least-used expert
# 0.26% -> 5.1% of tokens, effK 13.79 -> 15.83 of 16) and is ~24% faster.  It IS worse on train
# loss (+0.047 nats); for this knob loss has been the wrong signal three times, so select on Avg11.
#
# This is a RERUN, not a resume: the parent completed its cosine decay to the LR floor, so extending
# the schedule and resuming would re-raise the LR mid-run.  Fresh save_path, fresh wandb name.
#
# ONLY deliberate differences from abl_H_400M_6G6E_deep: routing_norm zscore -> none on all six
# energy blocks, the data path moved to the shared FULL corpus copy, and the run names.  The
# architecture, schedule, mbs/ga, K, top_k, I_e, Sinkhorn and sparsity are untouched, so the
# comparison against the parent isolates the routing normalisation.
#
# Kept at mbs 2 / ga 8 deliberately, matching the parent that ran to completion at a median
# 1.509 s/step (~26 h for 32.0B).  mbs 4 / ga 4 would put tokens/call at 16,384 where sparse_forward
# wins 2.1-2.4x instead of the 8,192 losing column, and would likely be much faster at identical
# tokens/step -- but it raises activation memory on a 12-distinct-layer model and was not smoke
# tested, and an OOM on this arm costs more than the hours it would save.  Worth trying separately.
#
# 61035 steps x 524,288 tok/step (8 GPU x mbs 2 x ga 8 x 4096) = 32.0B -- LAUNCH AT EXACTLY 8 GPUs.
# No recurrence anywhere, so FLOPwt == ACTIVE == 238.02M and TOTAL == 399.85M (audit_config).
# Data: the shared FULL corpus copy validated 2026-09-23, NOT the 18.6%-prefix subset.
#
# ABLATION H -- DEEP, NO RECURRENCE: 6 GPT + 6 DISTINCT energy blocks, each applied once.
# Separates distinct depth from recurrent depth at matched TOTAL parameters.
# I_total = 28,096 per block (K=32, I_e=878) -> total 399.855M (+0.018% vs the 400M hybrid).
# Active 238.022M, FLOPwt 238.022M -- with no recurrence FLOPwt EQUALS active.
# WARNING -- this arm spends 20.5% FEWER parameter-applications per token than the 400M hybrid
# (238.0M vs 299.4M) and 26% fewer than abl_G. Iso-TOTAL does not mean iso-FLOP across these
# structures; compare within a pair (H vs H-baseline), never H against G.
# sinkhorn_mu_iters = 1 = this block's layer_iterations entry (pre-flight rule 9).
# *** INTENDED GPU COUNT: 8 ***  mbs 2 x ga 8 x 4096 x 8 = 524,288 tok/step; 61,035 steps = 32.0B
