# abl_AA -- 134M TRUE SANDWICH (1G, 1x6E, 1G) MATCHED ON ALL THREE PARAMETER AXES.  PRIORITY 0.
#
# This is what the sandwich row of Table 1 should be.  The existing 134M sandwich abl_C is
# iso-TOTAL ONLY: same 134.25M total as the hybrid, but 20.1% short on ACTIVE (98.46 vs 123.24M)
# and 5.0% short on FLOPwt (134.64 vs 141.72M).  A sandwich has 2 dense blocks where the hybrid has
# 6, and abl_C never paid that back, so "sandwich loses to hybrid" was partly a budget gap.
#
# Audited with energy_ff_paramcount.audit_config, NOT by hand (every hand-computed total in this
# project has come out LOW: swiglu c_fc is 2*I, energy_attention is 2*d*d):
#
#            TOTAL(M)  ACTIVE(M)  FLOPwt(M)  apps   structure
#   abl_R      134.25     123.24     141.72    12   6G(I=2048) then 1 energy block x6
#   abl_AA     134.25     123.24     141.71     8   1G(I=8192), energy x6, 1G(I=8192)
#   abl_C       98.46 ->  see above            8   old sandwich, iso-total only
#   abl_AA matches abl_R on all three to 0.00%.  Params are M; all three are higher = more capacity,
#   and the point is EQUALITY, not maximisation.
#
# WHY WIDER BREAD RATHER THAN WIDER EXPERTS.  The three axes respond differently:
#     TOTAL  <- K * I_e      (every expert stored)
#     ACTIVE <- k * I_e      (only top_k run)
#     FLOPwt <- R * (energy block active params)
# so raising I_e raises TOTAL K/k = 8x faster than ACTIVE.  Widening the experts therefore CANNOT
# buy iso-active at iso-total; it is what sank abl_C.  Leaving the mixture block untouched and
# widening the two bread blocks does:
#   - energy block IDENTICAL to abl_R: K=16, top_k=2, intermediate_size 16384, I_e=1024,
#     I_e/hidden = 1.33, applied R=6 times.  (abl_C used 53248, I_e=3328.)
#   - dense bread 2048 -> 8192, I_G/hidden 2.67 -> 10.67.
# Because the mixture block is identical to the hybrid's, this arm isolates BLOCK PLACEMENT plus the
# dense-width redistribution.  Router, experts, Sinkhorn and sparsity are all unchanged.
# I_G/hidden = 10.67 is deliberately unusual; wide-shallow bread is the only way 2 dense blocks
# carry what 6 narrower ones did.  Pre-flight point 6 (I_e/hidden >= ~0.5) constrains EXPERT width,
# which is 1.33 here; it says nothing about dense I_G.
#
# DELIBERATE DEVIATION FROM PRE-FLIGHT RULE 9: sinkhorn_persist_mu is absent and
# cos_probe_interval: 100 is present, inherited from abl_C/abl_R/abl_U.  Rule 9 wants persist_mu
# true and no cos probe, but the measured cost of missing persist_mu on a HYBRID is ~0.003 nats,
# and abl_R -- the arm this is compared against -- has exactly the same two settings.  Matching the
# comparison arm beats fixing the flag on one side only, which would confound the result.
#
# 122070 steps x 262,144 tok/step (8 GPU x mbs 4 x ga 2 x 4096) = 32.0B -- LAUNCH AT EXACTLY 8 GPUs.
# tokens/call = mbs 4 x 4096 = 16,384, the column where sparse_forward wins 2.1-2.4x.
# Data: the shared FULL corpus copy validated 2026-09-23, NOT the 18.6%-prefix subset.
#
datasets:
- class_name: MegatronDataset
  data_name: Megatron
  data_sampling_ratio: 1
  class_args:
    eval_steps: 2
    data_cache_path: /proj/dmfexp/datasets-shared/.cache_megatron_cmix_FULL
    data_path:
    - 0.35
    - /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/web-nemotron-cc-hq-p2_0
    - 0.35
    - /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/web-nemotron-cc-hq-p2_1
    - 0.15
    - /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/megamath-web-pro_0
    - 0.15
    - /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/finemath-3plus-rewritten_0
    split: 99,0.5,0.5
    sequence_length: 4096
tokenizer_args:
  tokenizer_name: /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/tokenizers/granite-4.0-tiktoken
model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations:
    - 1
    - 6
    - 1
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 768
    num_layers: 3
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: psd_anti
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
    - &id001
      sequence_mixer_type: softmax_attention
      num_attention_heads: 12
      num_key_value_heads: 12
      add_bias: false
      attention_multiplier: 0.125
    - sequence_mixer_type: energy_attention
      num_attention_heads: 12
      num_key_value_heads: 12
      add_bias: false
      attention_multiplier: 0.125
    - *id001
    mlp_blocks:
    - &id002
      mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 8192
      add_bias: false
    - mlp_type: EnergyFF_BoltzmannMoE
      expert_kind: hopfield
      intermediate_size: 16384
      n_experts: 16
      top_k: 2
      hopfield_grad_scale: sqrt_consistent
      routing_norm: none
      temperature: 1.0
      repulsion_form: abs
      repulsion_coef: 0.1
      n_repulsion_pairs: 4
      gelu_grad_method: sigmoid
      e_sign_override: pos
      sinkhorn_iters: 3
      repulsion_tensor_idx: true
      activation_function: gelu
      add_bias: false
      sparse_forward: true
      sparse_candidates: 2
      sparse_explore: 2
      sparse_start_step: 300
      renormalize_topk: true
      fused_experts: true
      proxy_rank: 16
      proxy_kind: subspace
      proxy_out_dim: 512
      proxy_iters: 1
      proxy_loss_coef: 0.01
      proxy_init: svd
      repulsion_space: output
      repulsion_subsample: 64
      cos_probe_interval: 100
      sinkhorn_mu_iters: 6
    - *id002
tuning_args:
  tuning_method: pretraining
save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/boltzmann-moe/results/iclr26_abl/abl_AA_134M_sandwich_isoall
  save_interval: 2000
  max_to_keep: 2
logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-inference-large
    name: abl_AA_134M_sandwich_isoall
training_parameters:
  num_training_steps: 122070
  eval_interval: 5000
  micro_batch_size: 4
  gradient_accumulation_steps: 2
  eval_during_training: false
  gradient_clipping: 1
optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3
    weight_decay: 0.1
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 120070
mixed_precision_args:
  dtype: bf16
distributed_args:
  fsdp_algorithm: 2
  torch_compile: true
  stage: 0
