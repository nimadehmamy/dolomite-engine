# ARM D: 6G + 1 EGPT x6, NEW composable code, W1W2 experts, SPARSE with surrogate
# Uses EnergyFF_SurrogateBoltzmannMoE — the w1w2 sparse path with a learned MLP head.
# K=16 experts (more than C's 4, because sparse needs candidates), k=2.
# I_total=16384 to keep total params comparable.
# WITH surrogate + proxy_loss_coef, WITH Sinkhorn.
# total = ~158M (more experts = more total), active = ~80M
# 1.5x Chinchilla (active): 2.4B tokens = ~4600 steps @ 524288 tok/step
#
# PURPOSE: does sparse+surrogate w1w2 hurt vs dense w1w2 (C)? Isolates the sparse machinery cost.
datasets:
- class_name: MegatronDataset
  data_name: Megatron
  data_sampling_ratio: 1
  class_args:
    eval_steps: 2
    data_cache_path: /proj/dmfexp/nima/.cache/megatron_fwe_nemotron
    data_path:
    - 1.0
    - /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/web-nemotron-cc-hq-p2_0
    split: 99,0.5,0.5
    sequence_length: 4096
tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken
model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations:
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    - 6
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 768
    num_layers: 7
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: unconstrained
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
    - &gpt_attn {sequence_mixer_type: softmax_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
    - *gpt_attn
    - *gpt_attn
    - *gpt_attn
    - *gpt_attn
    - *gpt_attn
    - sequence_mixer_type: energy_attention
      num_attention_heads: 12
      num_key_value_heads: 12
      add_bias: false
      attention_multiplier: 0.125
    mlp_blocks:
    - &gpt_ffn {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
    - *gpt_ffn
    - *gpt_ffn
    - *gpt_ffn
    - *gpt_ffn
    - *gpt_ffn
    # W1W2, SPARSE with surrogate MLP head
    - mlp_type: EnergyFF_SurrogateBoltzmannMoE
      expert_kind: w1w2
      intermediate_size: 16384   # total = 16 experts x 1024 each
      n_experts: 16
      top_k: 2
      temperature: 1.0
      e_sign_override: neg       # correct for w1w2
      repulsion_coef: 0.1
      repulsion_form: abs
      repulsion_space: output
      repulsion_subsample: 64
      repulsion_tensor_idx: true
      n_repulsion_pairs: 4
      gelu_grad_method: sigmoid
      fused_experts: true
      sparse_forward: true
      sparse_start_step: 300
      sparse_candidates: 4
      sparse_explore: 2
      proxy_loss_coef: 0.01
      proxy_kind: subspace
      proxy_mu_convention: pre_mu
      surrogate_kind: mlp
      surrogate_hidden: 256
      surrogate_replaces_proxy: true
      use_surrogate: false
      surrogate_coef: 0.0
      sinkhorn_iters: 3
      sinkhorn_persist_mu: true
      sinkhorn_mu_iters: 6
      renormalize_topk: true
      routing_norm: none
      activation_function: gelu
      add_bias: false
tuning_args:
  tuning_method: pretraining
save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/boltzmann-moe/results/fwe/fineweb_D_new_w1w2_sparse
  save_interval: 1000
  max_to_keep: 2
logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: boltzmann-moe-fwe
    name: fineweb_D_6G1x6E_new_w1w2_sparse
training_parameters:
  num_training_steps: 4600
  # LAUNCH: 4 GPUs, tok/step=524288, total=2.41B tokens
  eval_interval: 1000
  micro_batch_size: 4
  gradient_accumulation_steps: 8
  eval_during_training: false
  gradient_clipping: 1
optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3
    weight_decay: 0.1
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 300
  num_constant_steps: 3840
  num_decay_steps: 460
mixed_precision_args:
  dtype: bf16
distributed_args:
  fsdp_algorithm: 2
  gradient_checkpointing_method: block
  torch_compile: true
  stage: 0
