# ==============================================================================================
# MULTI-NODE TRANSPORT (added 2026-09-23) -- NATIVE INFINIBAND IS THE DEFAULT, AND HOW TO FALL BACK
#
# If you launch this on MORE THAN ONE NODE, scripts/bsub/submit_train.sh now enables native
# InfiniBand automatically. You do not need to pass anything. Measured, placement-controlled (both
# transports on the SAME host pair, same config, 400 steps, zero genuine NCCL errors either side):
#     regime            TCP              native IB        speedup
#     dense             1.2861 s/step    0.9160 s/step    1.40x
#     sparse (300+)     1.1448 s/step    0.7069 s/step    1.62x
# The SPARSE row is the one that matters: sparse_start_step is 300 out of tens of thousands of steps,
# so a real run is sparse for >99% of its life.
#
# FALLBACK TO TCP IF YOU HIT TRANSPORT ERRORS:
#     FORCE_TCP=1 bash experiments/boltzmann-moe/scripts/bsub/submit_train.sh <name> <cfg> <gpus> ...
# (ALLOW_IB=0 is a synonym.) Expect TCP to be ~1.4-1.6x slower.
#
# WHEN to use it. ~50% of multi-node launches have historically died AT STARTUP with a LOUD
# ncclRemoteError / IBV_WC_RETRY_EXC_ERR on the first collective, then run fine on the next attempt.
# So RESUBMIT ONCE before reaching for FORCE_TCP; the watchdog resubmits by itself anyway. Only make
# TCP persistent if the same job keeps failing that way.
#
# WHEN NOT to use it. A SILENT stall at step 0 with ZERO NCCL errors is a DIFFERENT bug -- the
# weight-space repulsion wedge -- and TCP will not fix it. Keep repulsion_space: output (never
# weight) on anything multi-node. Also beware: our own scripts' COMMENTS contain the strings
# "ncclRemoteError" and "IBV_WC_RETRY_EXC_ERR" and the generated job script is echoed into the log,
# so a bare grep reports phantom errors. Require a real NCCL line:
#     grep -hE 'IBV_WC_RETRY_EXC_ERR|ncclRemoteError' <log>.stderr <log>.stdout \
#       | grep -E '[a-z0-9-]+:[0-9]+:[0-9]+|NCCL WARN'
# NCCL writes its banner and errors to STDOUT; the step lines go to STDERR. Check both.
# ==============================================================================================
# cmix_400M_hybrid_sparse -- PRIORITY 3. 400M hybrid: 6 dense-GPT layers (I=4096) then ONE energy block recurred x6.
# The 400M analogue of cmix_134M_hybrid's [1,1,1,1,1,1,6] shape. K=16, I_e=11742, sparse.
# ISO-PARAM with cmix_400M_baseline_switch: hopfield stores 1 matrix/expert, swiglu MoE stores 3,
# so energy I_total 187,872 == 3 x MoE I_total 62,624. Same rule the 134M pair uses.
# 61035 steps x 524,288 tok/step (8 GPU x mbs 2 x ga 8 x 4096) = 32.0B -- LAUNCH AT 8 GPUs.
# mbs 2 (not the sandwich's 1): tokens/call 8192 is the WINNING column for sparse_forward.
# sinkhorn_mu_iters 6 == layer_iterations[6]. repulsion output+subsample (multi-node safe).
# proxy_init: svd -- refit the proxy from the rank-r SVD of each expert weight at the
# dense->sparse switch. MEASURED on a trained 1B ckpt: top-2 agreement with the exact
# energies 0.0893 (distilled) vs 0.5541 (SVD) vs 0.0378 (random). Distillation continues
# after the refit; SVD is a warm start, not a replacement.
# K 16 -> 32 (2026-09-17), ISO-PARAM: I_total stays 187,872, so I_e halves to 5,871
# and total params are unchanged at 400M. p stays 4 (top-2 + 2 explore), so
# p/K falls 0.250 -> 0.125 and the sparse CEILING doubles 4.0x -> 8.0x.
# Rationale: (a) doubles the achievable saving at no parameter cost; (b) I_e=5,871 is
# still inside the proven 4480-15872 band; (c) our best historical arm was K=32/top-2
# (iclr_hop_K32_top2_sink, Avg11 44.58, against 40.96 for a K=16 pure); (d) it gives the
# paper a K axis that varies while recurrence is held, which the K=16/K=64 set could not.
# Switched at step ~500 of 61035 (0.8%), so the restart cost ~5 minutes.

datasets:
- class_name: MegatronDataset
  data_name: Megatron
  data_sampling_ratio: 1
  class_args:
    eval_steps: 2
    data_cache_path: /proj/dmfexp/datasets-shared/.cache_megatron_cmix_FULL
    data_path:
    - 0.35
    - /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/web-nemotron-cc-hq-p2_0
    - 0.35
    - /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/web-nemotron-cc-hq-p2_1
    - 0.15
    - /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/megamath-web-pro_0
    - 0.15
    - /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/finemath-3plus-rewritten_0
    split: 99,0.5,0.5
    sequence_length: 4096
tokenizer_args:
  tokenizer_name: /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/tokenizers/granite-4.0-tiktoken
model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations:
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    - 6
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 1024
    num_layers: 7
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: psd_anti
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
    - sequence_mixer_type: softmax_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    - sequence_mixer_type: softmax_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    - sequence_mixer_type: softmax_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    - sequence_mixer_type: softmax_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    - sequence_mixer_type: softmax_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    - sequence_mixer_type: softmax_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    - sequence_mixer_type: energy_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    mlp_blocks:
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: EnergyFF_BoltzmannMoE
      expert_kind: hopfield
      intermediate_size: 187872
      n_experts: 32
      top_k: 2
      hopfield_grad_scale: sqrt_consistent
      routing_norm: zscore
      temperature: 1.0
      repulsion_form: abs
      repulsion_coef: 0.1
      repulsion_space: output
      cos_probe_interval: 100
      n_repulsion_pairs: 4
      gelu_grad_method: sigmoid
      e_sign_override: pos
      sinkhorn_iters: 3
      sinkhorn_persist_mu: true
      sinkhorn_mu_iters: 6
      repulsion_tensor_idx: true
      renormalize_topk: true
      fused_experts: true
      sparse_start_step: 300
      sparse_forward: true
      sparse_candidates: 2
      sparse_explore: 2
      proxy_rank: 16
      proxy_kind: subspace
      proxy_out_dim: 512
      proxy_iters: 1
      proxy_loss_coef: 0.01
      activation_function: gelu
      add_bias: false
      repulsion_subsample: 64
      proxy_init: svd
tuning_args:
  tuning_method: pretraining
save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/boltzmann-moe/results/cmix/cmix_400M_hybrid_sparse
  save_interval: 200
  max_to_keep: 2
logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-inference-large
    name: cmix_400M_hybrid_sparse
training_parameters:
  num_training_steps: 61035
  eval_interval: 5000
  micro_batch_size: 2
  gradient_accumulation_steps: 8
  eval_during_training: false
  gradient_clipping: 1
optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3
    weight_decay: 0.1
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 53000
  num_decay_steps: 6035
mixed_precision_args:
  dtype: bf16
distributed_args:
  fsdp_algorithm: 2
  gradient_checkpointing_method: block
  torch_compile: true
  stage: 0
