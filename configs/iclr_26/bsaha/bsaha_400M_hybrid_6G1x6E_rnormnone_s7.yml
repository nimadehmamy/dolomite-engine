# 400M HYBRID 6G1x6E, routing_norm=none, SEED 7.  For bsaha.
# A SEED REPLICATE of our live abl_X_400M_hyb_rnorm_none (which runs the default seed).  We have two
# seeds at 134M and only ONE at 400M, and the 134M pair showed the seed spread is NOT negligible:
# 0.16pp Avg11 on the oracle-routed path but 0.87pp on the DEPLOYED sparse path.  A single 400M
# number therefore cannot support a claim of the size we want to make, which is why this exists.
#
# LAUNCH:
#   cd /proj/dmfexp/nima/Code/dolomite-engine
#   bash experiments/boltzmann-moe/scripts/bsub/submit_train.sh bsaha_400M_hyb_s7 \
#        configs/iclr_26/bsaha/bsaha_400M_hybrid_6G1x6E_rnormnone_s7.yml 8 preemptable 24:00 400G
#
# STRUCTURE: 6 dense GPT blocks (I=4096) then ONE energy Boltzmann-MoE block applied SIX times
# (layer_iterations [1,1,1,1,1,1,6] = 12 applications).  1x6E means ONE block reused six times; six
# distinct blocks is a different model.  K=32, top-2, intermediate_size 187872 TOTAL across experts
# (I_e=5871, I_e/hidden 5.73).  TOTAL/ACTIVE/FLOPwt = 399.78 / 219.43 / 299.38 M.
#
# 61035 steps x 524,288 tok/step (8 GPU x mbs 4 x ga 4 x 4096) = 32.0B.  LAUNCH AT EXACTLY 8 GPUs --
# GPUS IS NOT IN THIS FILE, so 4 GPUs would silently give half the budget and the run would not be
# comparable to anything in our tables.  tokens/call = 16,384, the column where sparse_forward wins.
#
# routing_norm: none is the single largest knob we found: at 134M it is +1.49pp Avg11 on the
# block-position variant, +0.10pp on the hybrid, it collapses a 1.37pp block-placement penalty to
# 0.02pp, it does NOT collapse routing (least-used expert 0.26% -> 5.1% of tokens, effK 13.79 ->
# 15.83 of 16) and it is ~24% faster.  It IS worse on train loss (+0.047 nats) -- for this knob loss
# has been the wrong signal three times, so select on Avg11, not loss.
#
# Multi-node safe if you scale it up: repulsion_space output + subsample 64 (weight-space WEDGES
# silently on >1 node), stage 0, and the submitter sets NCCL_IB_DISABLE=1 for multi-node.
# Data is the shared FULL corpus copy.  On launch the trainer logs `Tokens per epoch:` per shard --
# the two web shards must read ~265-266e9; ~50e9 means the biased 18.6%-prefix subset.
#
datasets:
- class_name: MegatronDataset
  data_name: Megatron
  data_sampling_ratio: 1
  class_args:
    eval_steps: 2
    data_cache_path: /proj/dmfexp/datasets-shared/.cache_megatron_cmix_FULL
    data_path:
    - 0.35
    - /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/web-nemotron-cc-hq-p2_0
    - 0.35
    - /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/web-nemotron-cc-hq-p2_1
    - 0.15
    - /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/megamath-web-pro_0
    - 0.15
    - /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/finemath-3plus-rewritten_0
    split: 99,0.5,0.5
    sequence_length: 4096
tokenizer_args:
  tokenizer_name: /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/tokenizers/granite-4.0-tiktoken
model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations:
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    - 6
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 1024
    num_layers: 7
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: psd_anti
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
    - sequence_mixer_type: softmax_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    - sequence_mixer_type: softmax_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    - sequence_mixer_type: softmax_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    - sequence_mixer_type: softmax_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    - sequence_mixer_type: softmax_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    - sequence_mixer_type: softmax_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    - sequence_mixer_type: energy_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    mlp_blocks:
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: EnergyFF_BoltzmannMoE
      expert_kind: hopfield
      intermediate_size: 187872
      n_experts: 32
      top_k: 2
      hopfield_grad_scale: sqrt_consistent
      routing_norm: none
      temperature: 1.0
      repulsion_form: abs
      repulsion_coef: 0.1
      repulsion_space: output
      cos_probe_interval: 100
      n_repulsion_pairs: 4
      gelu_grad_method: sigmoid
      e_sign_override: pos
      sinkhorn_iters: 3
      sinkhorn_persist_mu: true
      sinkhorn_mu_iters: 6
      repulsion_tensor_idx: true
      renormalize_topk: true
      fused_experts: true
      sparse_start_step: 300
      sparse_forward: true
      sparse_candidates: 2
      sparse_explore: 2
      proxy_rank: 16
      proxy_kind: subspace
      proxy_out_dim: 512
      proxy_iters: 1
      proxy_loss_coef: 0.01
      activation_function: gelu
      add_bias: false
      repulsion_subsample: 64
      proxy_init: svd
tuning_args:
  tuning_method: pretraining
save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/boltzmann-moe/results/bsaha/bsaha_400M_hybrid_6G1x6E_rnormnone_s7
  save_interval: 200
  max_to_keep: 2
logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-inference-large
    name: bsaha_400M_hybrid_6G1x6E_rnormnone_s7
training_parameters:
  num_training_steps: 61035
  eval_interval: 5000
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  eval_during_training: false
  gradient_clipping: 1
optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3
    weight_decay: 0.1
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 53000
  num_decay_steps: 6035
mixed_precision_args:
  dtype: bf16
distributed_args:
  fsdp_algorithm: 2
  gradient_checkpointing_method: block
  torch_compile: true
  stage: 0
random_args:
  seed: 7
