# RETIRING: 400M sandwich, iso-TOTAL ONLY. layer_iterations [1,4,1] = 6 block
# applications against the hybrid's 12, so it is 28.7% short on ACTIVE and 27.5% on FLOPwt. Superseded
# by bsaha_400M_sandwich_isoall below, which matches all three. Kept because its number is in the
# current Table 1 and a reviewer may ask.
#
# Data path updated to the shared FULL corpus copy (validated 2026-09-23); the original named
# /proj/datasets/granite-4-datasets-megatron-merged, which the owners may delete at any time.
# CHANGE save_path and the wandb name if you do not want to write into our results tree.
#
datasets:
- class_name: MegatronDataset
  data_name: Megatron
  data_sampling_ratio: 1
  class_args:
    eval_steps: 2
    data_cache_path: /proj/dmfexp/datasets-shared/.cache_megatron_cmix_FULL
    data_path:
    - 0.35
    - /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/web-nemotron-cc-hq-p2_0
    - 0.35
    - /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/web-nemotron-cc-hq-p2_1
    - 0.15
    - /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/megamath-web-pro_0
    - 0.15
    - /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/finemath-3plus-rewritten_0
    split: 99,0.5,0.5
    sequence_length: 4096
tokenizer_args:
  tokenizer_name: /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/tokenizers/granite-4.0-tiktoken
model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations:
    - 1
    - 4
    - 1
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 1024
    num_layers: 3
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: psd_anti
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
    - &id001
      sequence_mixer_type: softmax_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    - sequence_mixer_type: energy_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    - *id001
    mlp_blocks:
    - &id002
      mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: EnergyFF_BoltzmannMoE
      expert_kind: hopfield
      intermediate_size: 253952
      n_experts: 32
      top_k: 2
      hopfield_grad_scale: sqrt_consistent
      routing_norm: none
      temperature: 1.0
      repulsion_form: abs
      repulsion_coef: 0.1
      repulsion_space: output
      cos_probe_interval: 100
      n_repulsion_pairs: 4
      gelu_grad_method: sigmoid
      e_sign_override: pos
      sinkhorn_iters: 3
      sinkhorn_persist_mu: true
      sinkhorn_mu_iters: 4
      repulsion_tensor_idx: true
      renormalize_topk: true
      fused_experts: true
      sparse_start_step: 300
      sparse_forward: true
      sparse_candidates: 2
      sparse_explore: 2
      proxy_rank: 16
      proxy_kind: subspace
      proxy_out_dim: 512
      proxy_iters: 1
      proxy_loss_coef: 0.01
      activation_function: gelu
      add_bias: false
      proxy_init: svd
      repulsion_subsample: 64
    - *id002
tuning_args:
  tuning_method: pretraining
save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/boltzmann-moe/results/tok32B/abl_Y_400M_sandwich_rnorm_none
  save_interval: 200
  max_to_keep: 2
logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-inference-large
    name: abl_Y_400M_sandwich_rnorm_none
training_parameters:
  num_training_steps: 61035
  eval_interval: 5000
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  eval_during_training: false
  gradient_clipping: 1
optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3
    weight_decay: 0.1
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 53000
  num_decay_steps: 6035
mixed_precision_args:
  dtype: bf16
distributed_args:
  fsdp_algorithm: 2
  gradient_checkpointing_method: block
  torch_compile: true
  stage: 0
