# RECOMMENDED 400M CONFIG -- our best-known settings as of 2026-09-23.
#
# WHAT MAKES THIS "BEST", and what the evidence is:
#
# 1. routing_norm: none  (NOT zscore).  At 134M this is +1.49pp Avg11 on the block-position variant
#    and +0.10pp on the hybrid, and it COLLAPSES the 1.37pp block-placement penalty to 0.02pp -- so
#    that penalty was zscore-specific, not architectural.  It also does NOT collapse routing: the
#    least-used expert goes from 0.26% of tokens (zscore) to 5.1-5.3%, effK 13.79 -> 15.83 of 16,
#    and entropy RISES.  And it is ~24% faster.  It IS worse on train loss (+0.047 nats), which for
#    this knob has been the wrong signal three times -- select on Avg11, not loss.
#
# 2. micro_batch_size 4 / gradient_accumulation_steps 4  (NOT mbs 2 / ga 8, NOT mbs 1 / ga 16).
#    tokens/step is unchanged at 8 x 4 x 4 x 4096 = 524,288, so the gradient is the same sum over the
#    same tokens -- but tokens/CALL goes to 16,384, where sparse_forward WINS 2.1-2.4x.  Below
#    ~16,384 it LOSES (0.41-0.49x).  Measured effect: 6.397 -> 3.783 s/step, a 1.69x speedup for
#    free.  If you change mbs, change ga inversely or you change the token budget.
#
# 3. LAUNCH AT EXACTLY 8 GPUs.  GPUS IS NOT IN THIS FILE.  tokens/step = GPUS x mbs x ga x seq, so
#    4 GPUs would give HALF the intended 32.0B budget and the run would not be comparable.
#
# 4. Data: /proj/dmfexp/datasets-shared/granite-4-cmix-FULL -- an INDEPENDENT FULL-CORPUS COPY made
#    2026-09-23 (a real copy, not a hard link), readable by everyone in POSIX group proj_dmfexp.  It
#    is deliberately NOT group-writable, so nobody can truncate it in place.
#    Do NOT use /proj/dmfexp/datasets-shared/granite-4-cmix-subset: its web shards are an 18.6% byte
#    PREFIX that is ~0.47 nats EASIER than the rest of the corpus, so subset-trained losses cannot
#    be compared with full-corpus ones.  And NEVER pair .idx from one directory with .bin from
#    another: full .idx + subset .bin reads past EOF, subset .idx + full .bin silently trains on the
#    first 18.6% only, and neither necessarily errors.
#    data_cache_path below is a group-writable SHARED Megatron blend cache, so the first person to
#    run pays the index build and everyone after reuses it.
#
# 5. Use a FRESH data_cache_path if you change any data path -- the Megatron blend index is keyed on
#    the mix and the paths.
#
# Submit with:
#   bash experiments/boltzmann-moe/scripts/bsub/submit_train.sh myrun \
#        configs/RECOMMENDED_400M_hybrid_best.yml 8 ebm 24:00 400G
# then CHANGE save_path and the wandb name below, or you will collide with our run.
#
# cmix_400M_hybrid_sparse -- PRIORITY 3. 400M hybrid: 6 dense-GPT layers (I=4096) then ONE energy block recurred x6.
# The 400M analogue of cmix_134M_hybrid's [1,1,1,1,1,1,6] shape. K=16, I_e=11742, sparse.
# ISO-PARAM with cmix_400M_baseline_switch: hopfield stores 1 matrix/expert, swiglu MoE stores 3,
# so energy I_total 187,872 == 3 x MoE I_total 62,624. Same rule the 134M pair uses.
# 61035 steps x 524,288 tok/step (8 GPU x mbs 4 x ga 4 x 4096) = 32.0B -- LAUNCH AT 8 GPUs.
# mbs 4 / ga 4 (see point 2 above): tokens/call 16,384 is the winning column for sparse_forward.
# sinkhorn_mu_iters 6 == layer_iterations[6]. repulsion output+subsample (multi-node safe).
# proxy_init: svd -- refit the proxy from the rank-r SVD of each expert weight at the
# dense->sparse switch. MEASURED on a trained 1B ckpt: top-2 agreement with the exact
# energies 0.0893 (distilled) vs 0.5541 (SVD) vs 0.0378 (random). Distillation continues
# after the refit; SVD is a warm start, not a replacement.
# K 16 -> 32 (2026-09-17), ISO-PARAM: I_total stays 187,872, so I_e halves to 5,871
# and total params are unchanged at 400M. p stays 4 (top-2 + 2 explore), so
# p/K falls 0.250 -> 0.125 and the sparse CEILING doubles 4.0x -> 8.0x.
# Rationale: (a) doubles the achievable saving at no parameter cost; (b) I_e=5,871 is
# still inside the proven 4480-15872 band; (c) our best historical arm was K=32/top-2
# (iclr_hop_K32_top2_sink, Avg11 44.58, against 40.96 for a K=16 pure); (d) it gives the
# paper a K axis that varies while recurrence is held, which the K=16/K=64 set could not.
# Switched at step ~500 of 61035 (0.8%), so the restart cost ~5 minutes.

datasets:
- class_name: MegatronDataset
  data_name: Megatron
  data_sampling_ratio: 1
  class_args:
    eval_steps: 2
    data_cache_path: /proj/dmfexp/datasets-shared/.cache_megatron_cmix_FULL
    data_path:
    - 0.35
    - /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/web-nemotron-cc-hq-p2_0
    - 0.35
    - /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/web-nemotron-cc-hq-p2_1
    - 0.15
    - /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/megamath-web-pro_0
    - 0.15
    - /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/finemath-3plus-rewritten_0
    split: 99,0.5,0.5
    sequence_length: 4096
tokenizer_args:
  tokenizer_name: /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/tokenizers/granite-4.0-tiktoken
model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations:
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    - 6
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 1024
    num_layers: 7
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: psd_anti
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
    - sequence_mixer_type: softmax_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    - sequence_mixer_type: softmax_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    - sequence_mixer_type: softmax_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    - sequence_mixer_type: softmax_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    - sequence_mixer_type: softmax_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    - sequence_mixer_type: softmax_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    - sequence_mixer_type: energy_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    mlp_blocks:
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: EnergyFF_BoltzmannMoE
      expert_kind: hopfield
      intermediate_size: 187872
      n_experts: 32
      top_k: 2
      hopfield_grad_scale: sqrt_consistent
      routing_norm: none
      temperature: 1.0
      repulsion_form: abs
      repulsion_coef: 0.1
      repulsion_space: output
      cos_probe_interval: 100
      n_repulsion_pairs: 4
      gelu_grad_method: sigmoid
      e_sign_override: pos
      sinkhorn_iters: 3
      sinkhorn_persist_mu: true
      sinkhorn_mu_iters: 6
      repulsion_tensor_idx: true
      renormalize_topk: true
      fused_experts: true
      sparse_start_step: 300
      sparse_forward: true
      sparse_candidates: 2
      sparse_explore: 2
      proxy_rank: 16
      proxy_kind: subspace
      proxy_out_dim: 512
      proxy_iters: 1
      proxy_loss_coef: 0.01
      activation_function: gelu
      add_bias: false
      repulsion_subsample: 64
      proxy_init: svd
tuning_args:
  tuning_method: pretraining
save_args:
  save_path: /CHANGE/ME/results/my_400M_run
  save_interval: 200
  max_to_keep: 2
logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-inference-large
    name: CHANGEME_400M_hybrid_best
training_parameters:
  num_training_steps: 61035
  eval_interval: 5000
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  eval_during_training: false
  gradient_clipping: 1
optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3
    weight_decay: 0.1
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 53000
  num_decay_steps: 6035
mixed_precision_args:
  dtype: bf16
distributed_args:
  fsdp_algorithm: 2
  gradient_checkpointing_method: block
  torch_compile: true
  stage: 0
